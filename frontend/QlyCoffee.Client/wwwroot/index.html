    <!-- =====================================================================
         SEO — BỘ THẺ MẶC ĐỊNH CHO TOÀN SITE
         =====================================================================
         Đây là ứng dụng Blazor WebAssembly: HTML thật được JavaScript dựng ra
         sau khi tải xong. Googlebot có chạy JavaScript nên nó đọc được thẻ do
         component SeoHead sinh ra cho từng trang — nhưng các bot KHÔNG chạy
         JavaScript (Facebook, Zalo, Twitter lúc tạo khung xem trước link) thì
         chỉ đọc được đúng file này.

         Vì vậy mọi thẻ dưới đây là BẢN DỰ PHÒNG cho toàn site. Trang cụ thể sẽ
         ghi đè chúng qua <SeoHead> — xem Components/Common/SeoHead.razor.

         Thuộc tính data-seo-default đánh dấu những thẻ SẼ BỊ GỠ ngay khi Blazor
         dựng xong trang đầu tiên (xem window.qlySeo bên dưới). Không gỡ thì mỗi
         trang sẽ có hai thẻ canonical và hai thẻ description — Google gặp hai
         canonical mâu thuẫn thì bỏ qua cả hai.

         ⚠️ KHI DEPLOY LÊN TÊN MIỀN THẬT
         Sửa https://motchutcoffee.vn ở toàn bộ file này (dùng tìm-thay), và trong
         wwwroot/robots.txt + wwwroot/sitemap.xml.
         ===================================================================== -->

    <!-- Màu thanh trạng thái trên trình duyệt di động — khớp với nền giao diện.
         Khai báo cả hai chế độ để không bị lệch màu khi người dùng đổi sáng/tối.
         Giá trị lấy đúng từ token --bg trong design-system.css §1. -->
    <meta name="theme-color" content="#FCF9F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181410" media="(prefers-color-scheme: dark)" />

    <base href="/" />

    <!-- ĐẶT SCRIPT NÀY TRƯỚC CSS ĐỂ TRÁNH NHẤP NHÁY MÀU.
         Nếu chờ Blazor khởi động rồi mới áp dụng chủ đề thì người dùng chọn nền
         tối sẽ thấy một chớp trắng lúc tải trang. Đoạn script đồng bộ này chạy
         trước khi trình duyệt vẽ khung hình đầu tiên nên không bao giờ nhấp nháy. -->
    <script>
        window.qlyTheme = {
            apply: function (theme) {
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', theme);
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
            },
            isSystemDark: function () {
                return window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
        };

        // --------------------------------------------------------------------
        //  ẢNH MÓN BAY VÀO GIỎ HÀNG
        // --------------------------------------------------------------------
        //  Bấm "Thêm vào giỏ" xong, trước đây chỉ có một dòng thông báo nổi ở
        //  góc màn hình. Khách nhìn vào nút vừa bấm — chỗ con trỏ đang ở — nên
        //  không thấy gì thay đổi và hay bấm thêm lần nữa, thành ra thừa ly.
        //  Một ảnh nhỏ bay từ nút lên đúng nút giỏ hàng trả lời được hai câu
        //  hỏi cùng lúc: ĐÃ thêm, và thêm VÀO ĐÂU.
        //
        //  Quỹ đạo cong dựng bằng HAI phần tử lồng nhau, không phải bằng đường
        //  bezier: lớp ngoài lo phương ngang với nhịp chậm dần, lớp trong lo
        //  phương dọc với nhịp nhanh dần. Hai nhịp khác nhau cộng lại thành một
        //  đường vòng cung — ảnh trôi ngang trước rồi mới vút lên giỏ. Cho cả
        //  hai vào một keyframe thì chúng buộc phải dùng chung một nhịp và
        //  đường bay thành đường thẳng.
        //
        //  Nhận URL ảnh + selector chứ không nhận ElementReference, vì Blazor
        //  dựng lại vùng nút sau khi giỏ đổi, tham chiếu phần tử có thể đã cũ.
        // --------------------------------------------------------------------
        window.qlyCart = {
            flyToCart: function (imageUrl, sourceSelector, targetSelector) {
                var source = document.querySelector(sourceSelector);
                var target = document.querySelector(targetSelector);
                if (!source || !target) return;

                // Nảy nhẹ nút giỏ ở cuối đường bay. Đây là phần KHÔNG được bỏ:
                // kể cả khi không chạy được hiệu ứng bay thì vẫn phải có một
                // thay đổi nhìn thấy được ở giỏ hàng.
                var bumpCart = function () {
                    target.classList.remove('cart-bump');
                    void target.offsetWidth;   // ép tính lại bố cục để hiệu ứng chạy lại từ đầu
                    target.classList.add('cart-bump');
                    setTimeout(function () { target.classList.remove('cart-bump'); }, 600);
                };

                // Người chọn "giảm chuyển động" trong hệ điều hành thường là
                // người say chuyển động hoặc nhạy cảm tiền đình — cho họ cái
                // nảy nhẹ là đủ, không bắn gì ngang màn hình.
                var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (reduced || typeof Element.prototype.animate !== 'function') {
                    bumpCart();
                    return;
                }

                var from = source.getBoundingClientRect();
                var to = target.getBoundingClientRect();
                var size = 56;

                var dx = (to.left + to.width / 2) - (from.left + from.width / 2);
                var dy = (to.top + to.height / 2) - (from.top + from.height / 2);

                var track = document.createElement('div');
                track.className = 'fly-track';
                track.style.left = (from.left + from.width / 2 - size / 2) + 'px';
                track.style.top = (from.top + from.height / 2 - size / 2) + 'px';
                track.style.width = size + 'px';
                track.style.height = size + 'px';

                var ball = document.createElement('div');
                ball.className = 'fly-ball';
                if (imageUrl) ball.style.backgroundImage = 'url("' + imageUrl + '")';
                track.appendChild(ball);
                document.body.appendChild(track);

                var duration = 720;

                track.animate(
                    [{ transform: 'translateX(0)' },
                     { transform: 'translateX(' + dx + 'px)' }],
                    { duration: duration, easing: 'cubic-bezier(.12,.72,.3,1)', fill: 'forwards' }
                );

                var flight = ball.animate(
                    [{ transform: 'translateY(0) scale(1)',   opacity: 1 },
                     { transform: 'translateY(' + (dy * 0.72) + 'px) scale(.62)', opacity: 1, offset: .78 },
                     { transform: 'translateY(' + dy + 'px) scale(.22)', opacity: .15 }],
                    { duration: duration, easing: 'cubic-bezier(.66,0,.9,.4)', fill: 'forwards' }
                );

                // Dọn phần tử bay dù kết thúc bình thường hay bị hủy giữa chừng
                // (khách chuyển tab thì trình duyệt có thể dừng animation) —
                // không dọn thì mỗi lần thêm món để lại một div chết trong DOM.
                var land = function () {
                    if (track.parentNode) track.remove();
                    bumpCart();
                };
                flight.onfinish = land;
                flight.oncancel = land;
            }
        };

        try {
            var saved = localStorage.getItem('qly-theme');
            if (saved) window.qlyTheme.apply(saved);
        } catch (e) { /* chế độ riêng tư chặn localStorage — dùng theo hệ thống */ }

        // --------------------------------------------------------------------
        //  HIỆU ỨNG CUỘN & CHUỘT CỦA TRANG BÁN HÀNG
        // --------------------------------------------------------------------
        //  Bốn việc, tất cả điều khiển bằng thuộc tính data-* trong markup nên
        //  các trang .razor không phải gọi JS interop:
        //
        //    [data-reveal] / [data-reveal-group]  hiện dần khi cuộn tới
        //    [data-tilt], .product-card           nghiêng 3D theo con trỏ
        //    [data-spotlight]                     đèn soi theo con trỏ (--mx/--my)
        //    [data-parallax="hệ số"]              trôi chậm/nhanh hơn nhịp cuộn
        //    [data-depth] trong vùng spotlight    lệch theo chuột (hạt cà phê)
        //
        //  Blazor dựng trang SAU khi file này chạy và còn dựng lại khi đổi
        //  trang, nên phần tử được tìm bằng MutationObserver chứ không quét một
        //  lần lúc tải. Mọi cập nhật vị trí đều gom vào requestAnimationFrame:
        //  sự kiện chuột bắn hàng trăm lần mỗi giây, khung hình thì chỉ 60.
        //
        //  Người dùng bật "giảm chuyển động" thì cả khối này không chạy, thẻ
        //  <html> không có class .fx, và CSS hiển thị mọi thứ ở trạng thái tĩnh.
        // --------------------------------------------------------------------
        (function () {
            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduce || !('IntersectionObserver' in window)) return;

            var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
            document.documentElement.classList.add('fx');

            // --- Hiện dần ----------------------------------------------------
            var io = new IntersectionObserver(function (entries) {
                entries.forEach(function (e) {
                    if (!e.isIntersecting) return;
                    e.target.setAttribute('data-in', '');
                    io.unobserve(e.target);
                });
            }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });

            var parallaxEls = [];

            function bind() {
                document.querySelectorAll('[data-reveal]:not([data-fx])').forEach(function (el) {
                    el.setAttribute('data-fx', '');
                    io.observe(el);
                });
                document.querySelectorAll('[data-reveal-group]').forEach(function (group) {
                    var i = 0;
                    Array.prototype.forEach.call(group.children, function (el) {
                        if (el.hasAttribute('data-fx')) { i++; return; }
                        el.setAttribute('data-fx', '');
                        // Trễ tối đa 8 bậc: lưới 40 món mà trễ theo thứ tự thật
                        // thì món cuối phải chờ gần 3 giây mới hiện.
                        el.style.setProperty('--i', Math.min(i++, 8));
                        io.observe(el);
                    });
                });
                parallaxEls = Array.prototype.slice.call(document.querySelectorAll('[data-parallax]'));
                onScroll();
            }

            var queued = false;
            function schedule() {
                if (queued) return;
                queued = true;
                requestAnimationFrame(function () { queued = false; bind(); });
            }

            // --- Parallax theo cuộn ------------------------------------------
            // Chỉ tính cho phần tử đang nằm trong khung nhìn, dịch theo khoảng
            // cách từ tâm phần tử tới tâm màn hình — nên ảnh nằm đúng chỗ khi
            // nó ở giữa màn hình, bất kể nó nằm sâu bao nhiêu trong trang.
            var scrollQueued = false;
            function onScroll() {
                if (scrollQueued) return;
                scrollQueued = true;
                requestAnimationFrame(function () {
                    scrollQueued = false;
                    var vh = window.innerHeight;
                    parallaxEls.forEach(function (el) {
                        var host = el.parentElement || el;
                        var r = host.getBoundingClientRect();
                        if (r.bottom < 0 || r.top > vh) return;
                        var k = parseFloat(el.getAttribute('data-parallax')) || 0;
                        var offset = (r.top + r.height / 2 - vh / 2) * k;
                        el.style.transform = 'translate3d(0,' + offset.toFixed(1) + 'px,0)';
                    });
                });
            }
            window.addEventListener('scroll', onScroll, { passive: true });
            window.addEventListener('resize', onScroll, { passive: true });

            // --- Chuột: nghiêng thẻ + đèn soi --------------------------------
            if (finePointer) {
                var pending = null, tilted = null, moveQueued = false;

                document.addEventListener('pointermove', function (e) {
                    pending = e;
                    if (moveQueued) return;
                    moveQueued = true;
                    requestAnimationFrame(function () {
                        moveQueued = false;
                        var ev = pending; pending = null;
                        if (!ev) return;

                        var card = ev.target.closest && ev.target.closest('[data-tilt], .product-card');
                        if (tilted && tilted !== card) {
                            tilted.classList.remove('is-tilting');
                            tilted = null;
                        }
                        if (card) {
                            var r = card.getBoundingClientRect();
                            var x = (ev.clientX - r.left) / r.width;
                            var y = (ev.clientY - r.top) / r.height;
                            card.style.setProperty('--ry', ((x - 0.5) * 12).toFixed(2) + 'deg');
                            card.style.setProperty('--rx', ((0.5 - y) * 10).toFixed(2) + 'deg');
                            card.style.setProperty('--gx', (x * 100).toFixed(1) + '%');
                            card.style.setProperty('--gy', (y * 100).toFixed(1) + '%');
                            card.classList.add('is-tilting');
                            tilted = card;
                        }

                        var spot = ev.target.closest && ev.target.closest('[data-spotlight]');
                        if (spot) {
                            var s = spot.getBoundingClientRect();
                            var px = (ev.clientX - s.left) / s.width - 0.5;
                            var py = (ev.clientY - s.top) / s.height - 0.5;
                            spot.style.setProperty('--mx', (ev.clientX - s.left) + 'px');
                            spot.style.setProperty('--my', (ev.clientY - s.top) + 'px');
                            spot.style.setProperty('--px', (px * 2).toFixed(3));
                            spot.style.setProperty('--py', (py * 2).toFixed(3));
                            spot.querySelectorAll('[data-depth]').forEach(function (b) {
                                var d = parseFloat(b.getAttribute('data-depth')) || 0;
                                b.style.setProperty('--dx', (px * d * 2).toFixed(1) + 'px');
                                b.style.setProperty('--dy', (py * d * 2).toFixed(1) + 'px');
                            });
                        }
                    });
                }, { passive: true });

                // Rời cửa sổ thì trả thẻ về phẳng, không để nó nghiêng mãi.
                document.addEventListener('pointerleave', function () {
                    if (tilted) { tilted.classList.remove('is-tilting'); tilted = null; }
                });
            }

            function start() {
                bind();
                new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
            else start();
        })();

        // --------------------------------------------------------------------
        //  GỠ BỘ THẺ SEO MẶC ĐỊNH
        // --------------------------------------------------------------------
        //  Component SeoHead THÊM thẻ mới vào <head> chứ không thay thế thẻ có
        //  sẵn — đó là cách <HeadOutlet> của Blazor hoạt động. Kết quả là mỗi
        //  trang có hai bộ thẻ: bộ mặc định trong file này và bộ của trang.
        //
        //  Hàm dưới gỡ bộ mặc định đi, được gọi từ SeoHead sau lần dựng đầu tiên.
        //  Thời điểm gọi rất quan trọng: gọi SAU khi Blazor đã ghi thẻ của trang,
        //  nên không bao giờ có khoảnh khắc <head> thiếu thẻ mô tả.
        //
        //  Bot không chạy JavaScript không bao giờ thấy hàm này chạy — chúng đọc
        //  bộ mặc định, đúng như thiết kế.
        // --------------------------------------------------------------------
        window.qlySeo = {
            clearDefaults: function () {
                var tags = document.querySelectorAll('[data-seo-default]');
                for (var i = 0; i < tags.length; i++) tags[i].remove();
                // Gọi lần thứ hai là vô hại: querySelectorAll trả về danh sách rỗng.
                return tags.length;
            }
        };
    </script>

         index.html riêng của nó — serif editorial đặt lên bảng tồn kho thì vừa
         khó đọc vừa lạc tông. Token --font-display được đè ở css/app.css.

         Tải bốn nét 500–800 chứ không tải cả dải 400–900: mỗi nét là một file
         thật, tải nét không ai dùng là bắt khách trả băng thông cho số không.

         preconnect mở sẵn kết nối tới hai máy chủ của Google Fonts ngay từ đầu,
         tiết kiệm khoảng 100–300ms so với để trình duyệt tự phát hiện.
         crossorigin trên dòng gstatic là BẮT BUỘC — file font tải theo chế độ
         CORS, thiếu thuộc tính này thì preconnect vô tác dụng.

         display=swap: hiện ngay bằng font hệ thống rồi mới đổi sang font tải về.
         Trang không bao giờ trắng chữ chờ font — Google phạt điểm việc đó.
         Mạng chặn Google Fonts thì rơi về font hệ thống, bố cục vẫn nguyên vẹn
         vì mọi kích thước tính bằng rem.
         ===================================================================== -->

        .boot-screen {
