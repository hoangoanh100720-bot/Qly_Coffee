# ==============================================================================
#  QLY COFFEE — Hạ tầng cho môi trường phát triển
#  Chạy:  docker compose up -d
#  Dừng:  docker compose down          (giữ dữ liệu)
#  Xóa:   docker compose down -v       (xóa luôn dữ liệu)
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # PostgreSQL — cơ sở dữ liệu chính
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: qly-coffee-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-qly_coffee}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      # Bắt buộc dùng UTF-8 để lưu tiếng Việt có dấu chính xác
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - qly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-qly_coffee}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # pgAdmin — giao diện xem/sửa database trực tiếp (tùy chọn, chỉ dùng khi dev)
  # Truy cập: http://localhost:5050
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: qly-coffee-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@qlycoffee.vn
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]   # chỉ chạy khi: docker compose --profile tools up -d

volumes:
  qly_pgdata:
    name: qly_coffee_pgdata
